name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: if main/cla-signatures is protected and the bot cannot push,
          # add a classic PAT with repo scope as secret PERSONAL_ACCESS_TOKEN
          # (and allow that account to bypass branch protection for signature writes).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: https://github.com/What-Is-AI/what-is-ai-course/blob/main/CLA.md
          # Keep signatures off main so CLA sign-offs do not trigger production deploys.
          branch: cla-signatures
          path-to-signatures: .github/cla/signatures.json
          allowlist: dependabot[bot],github-actions[bot]
          remote-organization-name: What-Is-AI
          remote-repository-name: what-is-ai-course
